# 跨平台单元测试：Windows 与 macOS 各跑一遍。
#
# 为什么必须两边都跑：
#   - `test_windows_*` / `test_wine_*` 专测 Win32 句柄、ACL、记录目录；
#   - `test_mac_*` / `test_darwin_*` 专测 macOS 原生保护与 ACL；
#   - 在非对应宿主上它们必然失败，但那是「未在该平台验收」，不是代码缺陷。
#   平台归属由 `tests/platform_scope.py` 声明：每个文件/用例写明 posix / windows /
#   both（默认 both，fail-closed）。未声明的文件必须两边都过；声明了另一平台的
#   才会被跳过，且跳过清单每次都会打印，不是静默。
#
#   两条额外信号（都会打印，不会静默）：
#   - 「Windows 覆盖缺口」：被测逻辑跨平台但夹具仍绑定 POSIX，待补而非豁免；
#   - 「已知红灯」：两平台都已坏的历史文件，登记计数；一旦通过即报 STALE 并让
#     job 红，逼着把它从清单里删掉。
#
# 不跑的：`tests/run_isolated.sh`（POSIX shell + lsof）——它需要隔离项目与
# 假 HOME，只在本地 macOS 跑；`test_cli_live` 需要真实服务。
#
# 依赖：纯标准库 + pytest（Win32 通过 ctypes.WinDLL 直调，不需要 pywin32）。

name: test-suite

on:
  workflow_dispatch:
    inputs:
      files:
        description: '只跑这些文件（空格分隔，留空跑全部）'
        required: false
        default: ''
  push:
    tags:
      - 'test-v*'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  # Windows 控制台默认 cp1252；测试与工具输出含中文，必须显式 UTF-8。
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  windows:
    name: windows/amd64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Environment fingerprint
        run: |
          python -c "import platform,sys; print(platform.platform()); print(sys.version)"

      - name: Run unit suite (per-file isolation)
        # run_unit_suite.py 对每个文件起独立进程：Windows 仿真用例会临时改写
        # os.name，同进程跨文件串联会互相污染。
        shell: bash
        run: python tests/run_unit_suite.py -j 4 ${{ inputs.files }}

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            .pytest_cache
          if-no-files-found: ignore

  macos:
    name: darwin/arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Environment fingerprint
        run: |
          python -c "import platform,sys; print(platform.platform()); print(sys.version)"

      - name: Run unit suite (per-file isolation)
        run: python tests/run_unit_suite.py -j 4
